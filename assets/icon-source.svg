<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3d47"/>
      <stop offset="0.55" stop-color="#294c60"/>
      <stop offset="1" stop-color="#6e4379"/>
    </linearGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ffb673" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ff8a4a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffdcae"/>
      <stop offset="0.5" stop-color="#ffab5e"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <!-- a5's geometry with the cream glass instead of neutral white -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#f2e6c9" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffc98f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="662" rx="470" ry="250" fill="url(#pool)"/>

  <ellipse cx="512" cy="704" rx="420" ry="86" fill="url(#pool)"/>
  <rect x="166" y="686" width="692" height="38" rx="19" fill="url(#rail)"/>

  <rect x="174" y="496" width="190" height="190" rx="48" fill="url(#glass)"
        stroke="#fff7e8" stroke-opacity="0.45" stroke-width="4"/>
  <rect x="660" y="496" width="190" height="190" rx="48" fill="url(#glass)"
        stroke="#fff7e8" stroke-opacity="0.45" stroke-width="4"/>

  <circle cx="512" cy="544" r="280" fill="url(#pool)"/>
  <rect x="392" y="424" width="240" height="240" rx="62" fill="url(#ember)"/>
</svg>
