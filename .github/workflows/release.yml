name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipk=$(ls dist/*.ipk)
          gh release create "$GITHUB_REF_NAME" "$ipk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
