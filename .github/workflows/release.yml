name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # GitHub Pages, for Ember's Homebrew Channel repository (scripts/build-repo.ts).
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipk=$(ls dist/*.ipk)
          gh release create "$GITHUB_REF_NAME" "$ipk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      # The repository the TV adds: dist/repo holds the index, the manifest and
      # the landing page. Deploy last, so a Pages problem cannot hold up the
      # release the index points at.
      - run: npm run repo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/repo
      - id: deploy
        uses: actions/deploy-pages@v5
